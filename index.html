<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모닝빈 카페</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <nav>
      <span class="logo">☕ 모닝빈</span>
      <a href="#menu">메뉴</a>
      <a href="#about">소개</a>
      <a href="#visit">오시는 길</a>
    </nav>
    <div class="hero-text">
      <h1>하루를 여는 한 잔</h1>
      <p>직접 로스팅한 원두와 갓 구운 빵이 있는 동네 카페</p>
      <a class="btn" href="#menu">메뉴 보기</a>
    </div>
  </header>

  <section id="menu">
    <h2>대표 메뉴</h2>
    <div class="cards">
      <div class="card"><span>☕</span><h3>아메리카노</h3><p>4,500원</p></div>
      <div class="card"><span>🥛</span><h3>카페라떼</h3><p>5,000원</p></div>
      <div class="card"><span>🍵</span><h3>말차라떼</h3><p>5,500원</p></div>
      <div class="card"><span>🥐</span><h3>크루아상</h3><p>3,800원</p></div>
    </div>
  </section>

  <section id="about" class="alt">
    <h2>모닝빈 이야기</h2>
    <p>매일 아침 신선한 원두를 로스팅해 따뜻한 한 잔을 내립니다.<br>편안한 공간에서 여유로운 시간을 보내세요.</p>
  </section>

  <section id="visit">
    <h2>오시는 길</h2>
    <p>서울시 예시구 커피로 123</p>
    <p>매일 08:00 – 21:00 (연중무휴)</p>
  </section>

  <footer>© 2026 모닝빈 카페</footer>
</body>
</html>
